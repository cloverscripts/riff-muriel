name: Release

on:
  push:
    tags:
      - 'v*'
  # also startable from the Actions tab (or the API) with a version; the workflow then creates the tag itself
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.1.0'
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          if [ -f .github/release-notes.md ]; then notes=(--notes-file .github/release-notes.md); else notes=(--generate-notes); fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Muriel ${TAG#v}" "${notes[@]}"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # channel: what update-core.js checks this build against, and how desktop-updater.js replaces it
          - os: windows-latest
            flag: --win
            channel: windows-setup
          - os: ubuntu-latest
            flag: --linux
            channel: linux
          - os: macos-latest
            flag: --mac dmg zip --x64 --arm64
            channel: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set version from tag
        shell: bash
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      - run: npm ci
      - name: Stamp the build for update checks
        shell: bash
        run: node tools/build-info.mjs build-info.js ${{ matrix.channel }}
      - name: Build and upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.flag }} --publish always

name: Muriel RS (Windows)

# Personal Rust build: only runs when started by hand, and the installer is attached to the run as an
# artifact. It never publishes a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Stage UI and backend
        run: node stage.mjs
      - name: Bundle Node for the backend
        shell: pwsh
        run: Invoke-WebRequest -Uri https://nodejs.org/dist/v22.11.0/win-x64/node.exe -OutFile backend/node.exe
      - name: Build
        run: npx --yes @tauri-apps/cli@2.1.0 build
      - uses: actions/upload-artifact@v4
        with:
          name: Muriel-RS-windows
          path: |
            rust/target/release/bundle/nsis/*.exe
            rust/target/release/muriel-rs.exe
          if-no-files-found: error
